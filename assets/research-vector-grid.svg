<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity="0.025"/></pattern>
    <pattern id="pix" width="10" height="10" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2" height="2" fill="#67E8F9" opacity="0.06"/><rect x="6" y="6" width="2" height="2" fill="#C084FC" opacity="0.05"/></pattern>
  </defs>
  <rect width="1200" height="640" fill="#05070D"/>
  <rect width="1200" height="640" fill="url(#scan)"/>
  <rect width="1200" height="640" fill="url(#pix)"/>

  <!-- stepped pixel gradient -->
  <g>
    <rect x="28" y="22" width="143" height="8" fill="#22D3EE"/><rect x="171" y="22" width="143" height="8" fill="#38BDF8"/>
    <rect x="314" y="22" width="143" height="8" fill="#3B82F6"/><rect x="457" y="22" width="143" height="8" fill="#6366F1"/>
    <rect x="600" y="22" width="143" height="8" fill="#7C3AED"/><rect x="743" y="22" width="143" height="8" fill="#8B5CF6"/>
    <rect x="886" y="22" width="143" height="8" fill="#A855F7"/><rect x="1029" y="22" width="143" height="8" fill="#C084FC"/>
  </g>

  <rect x="28" y="42" width="1144" height="568" fill="none" stroke="#36526F" stroke-width="2"/>
  <rect x="52" y="60" width="12" height="12" fill="#5CFF9D"/>
  <text x="76" y="71" fill="#8DF7FF" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2">RESEARCH_VECTOR // 04 ACTIVE DOMAINS</text>
  <text x="52" y="110" fill="#DDEAF8" font-family="Consolas, Menlo, monospace" font-size="15">SYSTEMS ENGINEERING + EVALUATION + SECURITY + SPEECH INTELLIGENCE</text>

  <!-- AI SECURITY -->
  <rect x="52" y="144" width="526" height="190" fill="#07151D" stroke="#22D3EE" stroke-width="2"/>
  <rect x="52" y="144" width="526" height="8" fill="#22D3EE"/>
  <text x="72" y="184" fill="#67E8F9" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">01 // AI SECURITY</text>
  <text x="72" y="212" fill="#9FE9F4" font-family="Consolas, Menlo, monospace" font-size="12">ROBUSTNESS  /  OOD  /  GENERATIVE SECURITY</text>
  <g fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="72" y="244">[+] Robustness of AI systems</text><text x="72" y="268">[+] Open-set / OOD evaluation</text>
    <text x="72" y="292">[+] Generative AI security</text><text x="72" y="316">[+] Reliability and failure analysis</text>
  </g>

  <!-- SPEECH -->
  <rect x="622" y="144" width="526" height="190" fill="#081225" stroke="#4F7DFF" stroke-width="2"/>
  <rect x="622" y="144" width="526" height="8" fill="#4F7DFF"/>
  <text x="642" y="184" fill="#93C5FD" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">02 // SPEECH &amp; TTS</text>
  <text x="642" y="212" fill="#B8CCFF" font-family="Consolas, Menlo, monospace" font-size="12">LONG-FORM  /  FORENSICS  /  AUDIO</text>
  <g fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="642" y="244">[+] Long-form speech generation</text><text x="642" y="268">[+] TTS evaluation</text>
    <text x="642" y="292">[+] Synthetic speech forensics</text><text x="642" y="316">[+] Robust audio intelligence</text>
  </g>

  <!-- LLM -->
  <rect x="52" y="370" width="526" height="190" fill="#0C1025" stroke="#7C6CFF" stroke-width="2"/>
  <rect x="52" y="370" width="526" height="8" fill="#7C6CFF"/>
  <text x="72" y="410" fill="#B8B5FF" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">03 // LLM SYSTEMS</text>
  <text x="72" y="438" fill="#C8C5FF" font-family="Consolas, Menlo, monospace" font-size="12">EVALUATION  /  MEMORY  /  PROTOCOLS</text>
  <g fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="72" y="470">[+] LLM evaluation</text><text x="72" y="494">[+] Context &amp; memory systems</text>
    <text x="72" y="518">[+] Protocol interoperability</text><text x="72" y="542">[+] Reproducible AI experiments</text>
  </g>

  <!-- AGENTS -->
  <rect x="622" y="370" width="526" height="190" fill="#150E24" stroke="#B15CFF" stroke-width="2"/>
  <rect x="622" y="370" width="526" height="8" fill="#B15CFF"/>
  <text x="642" y="410" fill="#D8B4FE" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">04 // AGENTS &amp; MCP</text>
  <text x="642" y="438" fill="#E4C8FF" font-family="Consolas, Menlo, monospace" font-size="12">TOOLS  /  WORKFLOWS  /  BOUNDARIES</text>
  <g fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="642" y="470">[+] Tool-augmented agents</text><text x="642" y="494">[+] MCP-based systems</text>
    <text x="642" y="518">[+] Multi-step research workflows</text><text x="642" y="542">[+] Agent safety and tool boundaries</text>
  </g>

  <g>
    <rect x="28" y="602" width="143" height="8" fill="#22D3EE"/><rect x="171" y="602" width="143" height="8" fill="#38BDF8"/>
    <rect x="314" y="602" width="143" height="8" fill="#3B82F6"/><rect x="457" y="602" width="143" height="8" fill="#6366F1"/>
    <rect x="600" y="602" width="143" height="8" fill="#7C3AED"/><rect x="743" y="602" width="143" height="8" fill="#8B5CF6"/>
    <rect x="886" y="602" width="143" height="8" fill="#A855F7"/><rect x="1029" y="602" width="143" height="8" fill="#C084FC"/>
  </g>
</svg>