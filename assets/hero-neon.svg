  <text x="74" y="92" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">RESEARCH NODE // XUWENBOOOO</text>
  <text x="70" y="150" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Wenbo Xu</text>
  <text x="74" y="184" fill="#BFDBFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">AI Security · Speech / TTS · LLM Systems · Agents / MCP</text>
  <text x="74" y="244" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BUILD → EVALUATE → AUDIT → UNDERSTAND</text>

  <rect x="36" y="28" width="1128" height="244" rx="18" stroke="url(#neon)" stroke-opacity="0.35"/>
